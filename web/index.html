<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#101411"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css?v=10"><title>遥控</title>
</head>
<body>
<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol><symbol id="i-touchpad" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 15h18M12 15v5"/></symbol><symbol id="i-mouse" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M6 9h12M12 2v7"/></symbol><symbol id="i-picture" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol><symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h1m4 0h1m4 0h1M6 13h1m4 0h1m4 0h1M7 16h10"/></symbol><symbol id="i-media" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7zM4 5v14"/></symbol><symbol id="i-arrows" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></symbol><symbol id="i-shortcuts" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-8z"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol><symbol id="i-left-click" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M6 9h12M12 2v7"/><path class="icon-fill" d="M11 3a5 5 0 0 0-4 5h4z"/></symbol><symbol id="i-right-click" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M6 9h12M12 2v7"/><path class="icon-fill" d="M13 3a5 5 0 0 1 4 5h-4z"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4zM11 13 22 2"/></symbol></svg>
<main class="app" data-dock="bottom">
<div id="touchpad" tabindex="0" role="application" aria-label="触摸板"><canvas id="screen-canvas" hidden></canvas><div id="live-indicator" hidden aria-live="polite"></div><div id="virtual-cursor" hidden aria-hidden="true"><svg viewBox="0 0 32 38"><path d="M3 2 L4 28 L11 22 L17 35 L23 32 L17 20 L28 19 Z"/></svg></div></div>
<aside class="dock" aria-label="遥控工具栏">
<div id="connection-status" role="status" aria-live="polite">正在连接…</div>
<div class="toolbar">
<div class="tool-group view-bar"><button id="view-toggle" class="tool-button" aria-label="实时画面" title="实时画面" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-screen"/></svg></button><div id="screen-controls" hidden><button id="screen-select" class="tool-button" aria-label="切换显示器" title="切换显示器" disabled><svg class="icon" aria-hidden="true"><use href="#i-screen"/></svg><span id="screen-number" class="button-badge">1</span></button></div><button id="input-mode" class="tool-button" hidden aria-label="触控板模式" title="触控板模式" aria-pressed="false"><svg class="icon mode-touchpad" aria-hidden="true"><use href="#i-touchpad"/></svg><svg class="icon mode-mouse" aria-hidden="true" hidden><use href="#i-mouse"/></svg></button><button id="display-settings" class="tool-button" aria-label="画面设置" title="画面设置" data-panel="display" aria-controls="panel-display" aria-expanded="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-picture"/></svg></button></div>
<div class="tool-group mouse-buttons" aria-label="鼠标操作"><button  class="tool-button" aria-label="左键" title="左键" data-click="left"><svg class="icon" aria-hidden="true"><use href="#i-left-click"/></svg></button><button id="drag-lock" class="tool-button" aria-label="锁定拖动" title="锁定拖动" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg></button><button  class="tool-button" aria-label="右键" title="右键" data-click="right"><svg class="icon" aria-hidden="true"><use href="#i-right-click"/></svg></button></div>
<nav class="tool-group" aria-label="遥控功能"><button  class="tool-button" aria-label="键盘" title="键盘" data-panel="keyboard" aria-controls="panel-keyboard" aria-expanded="false" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg></button><button  class="tool-button" aria-label="媒体控制" title="媒体控制" data-panel="media" aria-controls="panel-media" aria-expanded="false" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-media"/></svg></button><button  class="tool-button" aria-label="方向键" title="方向键" data-panel="navigation" aria-controls="panel-navigation" aria-expanded="false" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-arrows"/></svg></button><button  class="tool-button" aria-label="快捷键" title="快捷键" data-panel="shortcuts" aria-controls="panel-shortcuts" aria-expanded="false" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-shortcuts"/></svg></button><button  class="tool-button" aria-label="偏好设置" title="偏好设置" data-panel="settings" aria-controls="panel-settings" aria-expanded="false" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button></nav>
</div>
<div class="panel-shell" hidden>
<header class="panel-heading"><span id="panel-title"></span><button id="panel-close" class="tool-button" aria-label="收起面板" title="收起面板" data-panel="touch"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></header>
<section id="panel-display" class="panel" aria-label="画面设置" hidden>
<div class="screen-heading"><span>显示器</span><button id="refresh-screens" class="tool-button" aria-label="刷新显示器" title="刷新显示器" ><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div>
<div id="screen-options" role="group" aria-label="选择显示器"></div>
<div id="stream-settings">
<label>画质 <select id="stream-quality" aria-label="画质"><option value="original">原画</option><option value="high">高清 · 1440p</option><option value="balanced">清晰 · 1080p</option><option value="smooth">流畅 · 720p</option></select></label>
<label>帧率 <select id="stream-fps" aria-label="帧率上限"><option value="15">15 FPS</option><option value="30">30 FPS</option><option value="60" selected>60 FPS</option></select></label>
</div>
<div id="screen-status" role="status">正在连接画面…</div>

</section>
<section id="panel-keyboard" class="panel" aria-label="键盘" hidden>
<div class="text-row"><textarea id="text-input" rows="1" maxlength="2000" aria-label="输入文字" placeholder="输入文字"></textarea><button id="send-text" class="accent" aria-label="发送文字" title="发送文字"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button></div>
<div class="key-row"><button data-key="escape">Esc</button><button data-key="tab">Tab</button><button data-key="space">空格</button><button data-key="backspace" aria-label="退格">⌫</button><button data-key="enter" aria-label="回车">↵</button></div>
</section>
<section id="panel-media" class="panel" aria-label="媒体" hidden>
<div class="key-row"><button data-key="prev_track" aria-label="上一曲">Ⅰ◀</button><button data-key="play_pause" class="accent" aria-label="播放或暂停">▶Ⅱ</button><button data-key="next_track" aria-label="下一曲">▶Ⅰ</button></div>
<div class="key-row"><button data-key="volume_down">音量 −</button><button data-key="mute">静音</button><button data-key="volume_up">音量 ＋</button></div>
</section>
<section id="panel-navigation" class="panel" aria-label="方向键" hidden>
<div class="navigation-controls"><div class="side-keys"><button data-key="escape">Esc</button><button data-key="pageup">上一页</button></div><div class="dpad"><button data-key="up" aria-label="向上">↑</button><button data-key="left" aria-label="向左">←</button><button data-key="enter" class="accent">OK</button><button data-key="right" aria-label="向右">→</button><button data-key="down" aria-label="向下">↓</button></div><div class="side-keys"><button data-key="home">Home</button><button data-key="pagedown">下一页</button></div></div>
</section>
<section id="panel-shortcuts" class="panel" aria-label="快捷键" hidden>
<div class="key-row"><button data-shortcut="copy">复制</button><button data-shortcut="paste">粘贴</button><button data-shortcut="undo">撤销</button></div>
<div class="key-row"><button data-shortcut="select_all">全选</button><button data-shortcut="switch">切换窗口</button><button data-shortcut="desktop">桌面</button></div>
</section>
<section id="panel-settings" class="panel" aria-label="设置" hidden>
<label class="setting-row" for="sensitivity">灵敏度<input id="sensitivity" type="range" min="0.5" max="3" step="0.1" value="1.5"><output id="sensitivity-value">1.5×</output></label>
<div class="setting-row"><label for="natural-scroll">自然滚动 <input id="natural-scroll" type="checkbox" checked></label><button id="install">安装到桌面</button></div>
</section>
</div>
</aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js?v=10"></script>
</body></html>
